<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimório de Mesa</title>
<meta name="description" content="Consulta rápida de regras de D&D 2024 (SRD 5.2) para a mesa.">
<meta name="theme-color" content="#17202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grimório">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Federo&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de leitura (máx. 40rem), barra de busca fixa no topo, lista → ficha por âncora. */
:root {
  --paper: #EEF0EA;
  --surface: #F9FAF6;
  --ink: #1C2128;
  --muted: #59626C;
  --line: #D3D7CD;
  --accent: #1E6A64;
  --accent-ink: #F4F7F2;
  --cat-regra: #1E6A64;
  --cat-condicao: #A13F37;
  --cat-acao: #8C6619;
  --cat-magia: #4A51A0;
  --cat-classe: #7B3D6B;
  --cat-origem: #5B6B2E;
  --cat-talento: #9A4F1C;
  --cat-equip: #4F5B66;
  --cat-criatura: #6B4F2E;
  --bar: #1C2128;
  --bar-ink: #EEF0EA;
  --bar-field: #2A313A;
  --font-display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-label: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121518; --surface: #1A1E23; --ink: #E6E3D9; --muted: #9AA1A9; --line: #2B3138;
    --accent: #6BB8AD; --accent-ink: #0F1A19;
    --cat-regra: #6BB8AD; --cat-condicao: #E2867B; --cat-acao: #D6AE58; --cat-magia: #A3A9F2; --cat-classe: #D98FC6; --cat-origem: #B5C77A; --cat-talento: #E89A62; --cat-equip: #A9B6C2; --cat-criatura: #CFA77A;
    --bar: #0C0E10; --bar-ink: #E6E3D9; --bar-field: #1F242A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121518; --surface: #1A1E23; --ink: #E6E3D9; --muted: #9AA1A9; --line: #2B3138;
  --accent: #6BB8AD; --accent-ink: #0F1A19;
  --cat-regra: #6BB8AD; --cat-condicao: #E2867B; --cat-acao: #D6AE58; --cat-magia: #A3A9F2; --cat-classe: #D98FC6; --cat-origem: #B5C77A; --cat-talento: #E89A62; --cat-equip: #A9B6C2; --cat-criatura: #CFA77A;
  --bar: #0C0E10; --bar-ink: #E6E3D9; --bar-field: #1F242A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Barra superior */
.topo {
  position: sticky; top: 0; z-index: 10;
  background: var(--bar); color: var(--bar-ink);
  padding: calc(env(safe-area-inset-top, 0px) + 0.75rem) 1rem 0.75rem;
}
.topo-interno { max-width: 40rem; margin: 0 auto; display: grid; gap: 0.6rem; }
.marca { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.marca h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: 0.02em; }
.marca h1 a { color: inherit; text-decoration: none; }
.marca .fonte { font-family: var(--font-label); font-size: 0.8rem; letter-spacing: 0.06em; opacity: 0.7; }
.busca { position: relative; }
.busca input {
  width: 100%; border: 1px solid transparent; border-radius: var(--radius);
  background: var(--bar-field); color: var(--bar-ink);
  font: inherit; font-size: 1rem; padding: 0.6rem 2.4rem 0.6rem 0.85rem;
}
.busca input::placeholder { color: var(--bar-ink); opacity: 0.55; }
.busca input:focus { outline: none; border-color: var(--accent); }
.busca .limpar {
  position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
  border: 0; background: none; color: var(--bar-ink); opacity: 0.7;
  width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1;
}

/* Abas por capítulo */
.abas { display: flex; gap: 0.25rem; overflow-x: auto; scrollbar-width: none; margin: 0 -0.25rem -0.75rem; padding: 0 0.25rem; }
.abas::-webkit-scrollbar { display: none; }
.aba {
  flex: none; border: 0; background: none; color: var(--bar-ink); cursor: pointer;
  padding: 0.35rem 0.7rem 0.55rem; display: grid; text-align: left; gap: 0.05rem;
  border-bottom: 3px solid transparent; opacity: 0.72;
}
.aba[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--accent); }
.aba-cap { font-family: var(--font-label); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }
.aba-nome { font-family: var(--font-display); font-size: 1rem; font-weight: 700; white-space: nowrap; }

.cap-cab { margin: 0.4rem 0 0.6rem; }
.cap-num { font-family: var(--font-label); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.cap-cab h2 { margin: 0.1rem 0 0; font-family: var(--font-display); font-size: 1.7rem; line-height: 1.15; }
.secao { margin-top: 1.2rem; }
.secao-titulo { font-family: var(--font-label); font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.35rem; font-weight: 700; }
.secao-titulo .n, .opcoes .n { font-variant-numeric: tabular-nums; opacity: 0.7; margin-left: 0.4rem; }
.subs { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0 0 0.8rem 3.15rem; }
.subs .chip { text-decoration: none; color: var(--ink); font-size: 0.85rem; padding: 0.2rem 0.65rem; }

/* Características por extenso */
.carac { margin: 1.1rem 0 0; padding-top: 0.9rem; border-top: 1px solid var(--line); }
.carac-titulo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; margin: 0 0 0.45rem !important; color: var(--ink) !important; font-size: 1.15rem !important; }
.carac-titulo a { color: inherit; text-decoration: none; }
.carac-nivel { font-family: var(--font-label); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--surface); background: var(--cor); padding: 0.05rem 0.5rem; border-radius: 999px; }
.corpo h4 { font-family: var(--font-label); font-size: 0.95rem; letter-spacing: 0.04em; margin: 0.9rem 0 0.35rem; color: var(--cor); }
.opcoes { margin: 1.2rem 0 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.opcoes > summary { cursor: pointer; padding: 0.75rem 0.9rem; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.opcao { padding: 0.2rem 0.9rem 0.6rem; border-top: 1px solid var(--line); }
.opcao h4 a { color: inherit; text-decoration: none; }
.volta-classe { margin-top: 1.4rem; color: var(--muted); }

/* Conteúdo */
main { max-width: 40rem; margin: 0 auto; padding-inline: 1rem; padding-block: 0.9rem 3rem; }

.filtros { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem; scrollbar-width: none; }
.filtros::-webkit-scrollbar { display: none; }
.filtros + .filtros { margin-top: 0.1rem; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 0.3rem 0.8rem; cursor: pointer;
  font-family: var(--font-label); font-size: 0.92rem; letter-spacing: 0.03em; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filtro-classe { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 1rem; }
.chip .n { opacity: 0.6; font-variant-numeric: tabular-nums; margin-left: 0.3rem; }

.contagem { margin: 0.8rem 0 0.4rem; font-family: var(--font-label); font-size: 0.85rem; letter-spacing: 0.05em; color: var(--muted); }

.lista { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lista li { border-bottom: 1px solid var(--line); }
.item {
  display: grid; grid-template-columns: 2.4rem 1fr auto; gap: 0.75rem; align-items: start;
  padding: 0.75rem 0.15rem; text-decoration: none; color: inherit;
}
.item:hover .item-nome { color: var(--accent); }
.selo {
  width: 2.4rem; height: 2.4rem; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
  color: var(--surface); background: var(--cor);
}
.selo-icone svg { width: 1.8rem; height: 1.8rem; }
.ficha-cab.com-icone { grid-template-columns: auto 1fr auto; }
.ficha-icone { width: 3.4rem; height: 3.4rem; border-radius: 10px; background: var(--cor); color: var(--surface); display: grid; place-items: center; margin-top: 0.2rem; }
.ficha-icone svg { width: 2.5rem; height: 2.5rem; }
.item-texto { min-width: 0; }
.item-nome { font-weight: 700; font-size: 1.08rem; line-height: 1.25; }
.item-en { color: var(--muted); font-size: 0.85rem; font-style: italic; margin-left: 0.35rem; font-weight: 400; }
.item-resumo { color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
.item-lado { font-family: var(--font-label); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; padding-top: 0.2rem; white-space: nowrap; }
.item-lado .estrela { color: var(--cat-acao); }

.vazio { padding: 2rem 0; color: var(--muted); text-align: center; }

/* Ficha */
.voltar {
  display: inline-flex; align-items: center; gap: 0.35rem; border: 0; background: none; padding: 0.3rem 0;
  font-family: var(--font-label); letter-spacing: 0.04em; color: var(--accent); cursor: pointer; font-size: 0.95rem;
}
.ficha-cab { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: start; margin-top: 0.6rem; border-bottom: 2px solid var(--cor); padding-bottom: 0.7rem; }
.ficha-cat { font-family: var(--font-label); font-size: 0.85rem; letter-spacing: 0.08em; color: var(--cor); }
.ficha-cab h2 { margin: 0.1rem 0 0; font-family: var(--font-display); font-size: 2rem; line-height: 1.1; text-wrap: balance; }
.ficha-en { color: var(--muted); font-style: italic; }
.favoritar {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; cursor: pointer;
  width: 2.6rem; height: 2.6rem; display: grid; place-items: center; font-size: 1.2rem; color: var(--muted);
}
.favoritar[aria-pressed="true"] { color: var(--cat-acao); border-color: var(--cat-acao); }

.bloco-magia {
  margin: 1rem 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.7rem 1.2rem;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 0.8rem 0.9rem;
}
.bloco-magia div { min-width: 0; }
.bloco-magia .largo { grid-column: 1 / -1; }
.bloco-magia dt { font-family: var(--font-label); font-size: 0.78rem; letter-spacing: 0.07em; color: var(--muted); }
.bloco-magia dd { margin: 0; font-weight: 500; }

.corpo { margin-top: 1rem; max-width: 65ch; }
.corpo p { margin: 0 0 0.85rem; }
.corpo ul { margin: 0 0 0.9rem; padding-left: 1.15rem; display: grid; gap: 0.45rem; }
.corpo li::marker { color: var(--cor); }
.corpo h3 { font-family: var(--font-display); font-size: 1.2rem; margin: 1.4rem 0 0.5rem; color: var(--cor); }
.corpo strong { font-weight: 700; }
.corpo a.ref { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.tabela { overflow-x: auto; margin: 0 0 1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tabela table { border-collapse: collapse; width: 100%; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.tabela table.larga { min-width: 34rem; }
.tabela table.muito-larga { min-width: 46rem; }
.tabela table.larga th { white-space: nowrap; }
.tabela th { text-align: left; font-family: var(--font-label); font-weight: 700; letter-spacing: 0.04em; font-size: 0.85rem; color: var(--muted); }
.tabela th, .tabela td { padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabela tr:last-child td { border-bottom: 0; }
@media (max-width: 480px) { .tabela th, .tabela td { padding: 0.4rem 0.5rem; } .tabela table { font-size: 0.88rem; } }

.relacionados { margin-top: 1.5rem; }
.relacionados h3 { font-family: var(--font-label); font-size: 0.85rem; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.5rem; font-weight: 700; }
.relacionados div { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.relacionados a { text-decoration: none; }

.fonte-ficha { margin-top: 1.5rem; font-size: 0.82rem; color: var(--muted); }

/* Sobre */
.sobre h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 0.6rem 0 0.8rem; }
.sobre p { max-width: 65ch; }
.sobre .licenca { font-size: 0.9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 0.8rem; }

/* Rodapé e aviso */
.rodape { max-width: 40rem; margin: 0 auto; padding: 0 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem); color: var(--muted); font-size: 0.85rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.rodape a { color: var(--muted); }
.aviso {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); z-index: 20;
  width: min(36rem, calc(100% - 2rem));
  background: var(--ink); color: var(--paper); border-radius: var(--radius);
  padding: 0.75rem 0.9rem; display: flex; gap: 0.75rem; align-items: center; justify-content: space-between;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
}
.aviso button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0.4rem 0.75rem; cursor: pointer; font-weight: 700; white-space: nowrap; }
.aviso button.fechar { background: none; color: var(--paper); opacity: 0.7; padding: 0.4rem; }

.carregando { padding: 3rem 0; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .vista { animation: entrar 160ms ease-out; }
  @keyframes entrar { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* ===== Tema Eberron: Sharn à noite, latão e fragmentos de dragão ===== */
:root {
  --paper: #E4E8E5; --surface: #F4F5F2; --ink: #1B2430; --muted: #535E69; --line: #C6CDC8;
  --accent: #865617; --accent-ink: #FBF6EC;
  --brass: #C9A15A; --siberys: #E2B85A; --khyber: #4E3F86; --eberron: #9C2F2A;
  --cat-regra: #2F5D73; --cat-condicao: #9C2F2A; --cat-acao: #865617; --cat-magia: #4E3F86;
  --cat-classe: #6B2F4F; --cat-origem: #3B6647; --cat-talento: #9A4E1A; --cat-equip: #4B5966; --cat-criatura: #6B4F2E;
  --bar: #17202B; --bar-ink: #EDE6D6; --bar-field: #222E3C;
  --font-display: "Federo", "Alegreya SC", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111821; --surface: #18222E; --ink: #E8E2D4; --muted: #9AA3AE; --line: #283342;
    --accent: #D6AC62; --accent-ink: #1A1408;
    --cat-regra: #7FB2C9; --cat-condicao: #E08A7F; --cat-acao: #D6AC62; --cat-magia: #A99BEA;
    --cat-classe: #D795B6; --cat-origem: #8FC09A; --cat-talento: #E3A06A; --cat-equip: #A9B7C4; --cat-criatura: #CFA77A;
    --bar: #0B1118; --bar-field: #1A2532;
  }
}
:root[data-theme="dark"] {
  --paper: #111821; --surface: #18222E; --ink: #E8E2D4; --muted: #9AA3AE; --line: #283342;
  --accent: #D6AC62; --accent-ink: #1A1408;
  --cat-regra: #7FB2C9; --cat-condicao: #E08A7F; --cat-acao: #D6AC62; --cat-magia: #A99BEA;
  --cat-classe: #D795B6; --cat-origem: #8FC09A; --cat-talento: #E3A06A; --cat-equip: #A9B7C4; --cat-criatura: #CFA77A;
  --bar: #0B1118; --bar-field: #1A2532;
}
.topo { position: sticky; overflow: hidden; background:
  radial-gradient(120% 90% at 82% 0%, rgba(226,184,90,.16), transparent 60%), var(--bar); }
.horizonte { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34px; pointer-events: none; }
.horizonte .torres { fill: #0E151D; opacity: .9; }
.horizonte .flutuante { fill: #0E151D; opacity: .9; }
.horizonte .trilho { stroke: var(--brass); stroke-width: 1; opacity: .7; }
.topo-interno { position: relative; }
.marca h1 { font-weight: 400; font-size: 1.5rem; letter-spacing: .04em; }
.marca .fonte { color: var(--brass); opacity: 1; font-family: var(--font-body); letter-spacing: 0; }
.busca input { border-color: rgba(201,161,90,.25); }
.aba-cap { text-transform: none; letter-spacing: .02em; font-family: var(--font-body); font-style: italic; }
.aba-nome { font-weight: 400; letter-spacing: .03em; text-shadow: 0 0 6px var(--bar), 0 0 2px var(--bar); }
.aba[aria-pressed="true"] { border-bottom-color: var(--brass); }
.cap-num { text-transform: none; letter-spacing: .02em; font-family: var(--font-body); font-style: italic; color: var(--accent); }
.cap-cab h2, .ficha-cab h2 { font-weight: 400; letter-spacing: .02em; }
.secao-titulo { text-transform: none !important; letter-spacing: .02em !important; }
/* Selos em forma de fragmento de dragão */
.selo, .ficha-icone {
  border-radius: 0;
  clip-path: polygon(50% 0, 100% 22%, 100% 78%, 50% 100%, 0 78%, 0 22%);
  background: linear-gradient(155deg, color-mix(in srgb, var(--cor) 70%, #fff) 0%, var(--cor) 45%, color-mix(in srgb, var(--cor) 70%, #000) 100%);
}
.selo { width: 2.5rem; height: 2.85rem; }
.ficha-icone { width: 3.5rem; height: 4rem; }
.ficha-cab { border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 var(--brass); }
.horizonte .torres, .horizonte .flutuante { fill: #263446; opacity: 1; }
.horizonte .janelas { fill: var(--siberys); opacity: .85; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .horizonte .torres, :root:not([data-theme="light"]) .horizonte .flutuante { fill: #1B2633; } }
:root { --font-label: "Alegreya Sans", system-ui, sans-serif; }
.selo, .ficha-icone { color: #F7F0E1;
  background: linear-gradient(155deg, color-mix(in srgb, var(--cor) 62%, #fff 8%) 0%, color-mix(in srgb, var(--cor) 72%, #000) 52%, color-mix(in srgb, var(--cor) 40%, #000) 100%); }
.ficha-cat, .item-lado, .chip, .voltar { font-variant: normal; letter-spacing: .01em; }
.ficha-cat { font-style: italic; }

</style>
</head>
<body>
